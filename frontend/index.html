<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>星轨算力 · GPU Cloud Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M16 5l9 5v12l-9 5-9-5V10z' fill='none' stroke='%2307111f' stroke-width='2'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/base.css?v=20261125z188" />
<link rel="stylesheet" href="css/app.css?v=20261125z188" />
<link rel="stylesheet" href="css/pages.css?v=20261125z188" />
</head>
<body>
<div class="route-progress" id="routeProgress"></div>
<div id="bootLoading" role="status" aria-live="polite" style="position:fixed;inset:0;z-index:10001;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg,#0b1220);color:#94a3b8;font-size:13px;transition:opacity .15s ease">
  <div style="width:30px;height:30px;border:2px solid rgba(148,163,184,.25);border-top-color:#22d3ee;border-radius:50%;animation:bootspin .8s linear infinite"></div>
  <span>正在加载集群数据…</span>
</div>
<style>@keyframes bootspin{to{transform:rotate(360deg)}}</style>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/entrance" aria-label="星轨算力统一入口">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
          <path d="M12 3.2 20 7.6v8.8l-8 4.4-8-4.4V7.6z"/>
          <path d="M12 7.4v9.2M8.1 9.6v4.8M15.9 9.6v4.8"/>
        </svg>
      </span>
      <span class="brand-text"><strong>星轨算力</strong><small>GPU Cloud Console</small></span>
    </a>

    <button class="cluster-pill" id="clusterSwitcher">
      <span class="dot ok pulse"></span>
      <span class="cp-text"><b>GPU-Prod-01</b><small>自用 · API 在线</small></span>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>

    <nav class="nav" id="nav" aria-label="主导航"></nav>

    <div class="sidebar-foot">
      <div class="side-util">
        <div class="between"><span>GPU 利用率</span><b id="sideUtilVal">75%</b></div>
        <div class="bar"><i id="sideUtilBar" style="width:75%"></i></div>
      </div>
      <div class="status-pill">
        <span class="dot ok pulse"></span>
        <span><b id="svcState">平台服务在线</b><small>gateway · backend · postgres · redis</small></span>
      </div>
      <div class="side-meta">
        <span class="version">v0.4 · 生产环境</span>
        <button class="icon-btn sm" id="collapseBtn" title="收起侧栏" aria-label="收起侧栏">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="菜单">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="crumb"><span id="crumbCluster">GPU-Prod-01</span><i>/</i><b id="crumb">工作台</b></div>
      </div>

      <div class="topbar-mid">
        <button class="search-btn" id="searchBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
          <span>搜索作业、用户、GPU、节点…</span>
          <kbd>Ctrl K</kbd>
        </button>
      </div>

      <div class="topbar-right">
        <span class="live-pill" id="livePill" style="margin-right:4px"><i></i><span id="livePillText">实时</span></span>
        <button class="icon-btn" id="refreshBtn" title="刷新数据" aria-label="刷新数据">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
          <svg class="icon-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.4A8.5 8.5 0 0 1 9.6 3.5 8.5 8.5 0 1 0 20.5 14.4z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="icon-btn has-dot" id="bellBtn" title="通知" aria-label="通知">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
        </button>
        <div class="user" id="userMenu" role="button" tabindex="0">
          <span class="avatar" id="userAvatar">林</span>
          <span class="user-meta"><b id="userName">林予安</b><small id="userRole">平台管理员</small></span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
    </header>

    <main id="view" class="content" tabindex="-1"></main>
  </div>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="详情面板" tabindex="-1"></aside>

<div class="palette-overlay" id="paletteOverlay" hidden>
  <div class="palette" role="dialog" aria-label="命令面板">
    <div class="palette-head">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      <input id="paletteInput" placeholder="输入页面或操作，例如：GPU、作业、切换主题…" autocomplete="off" />
      <kbd>ESC</kbd>
    </div>
    <div class="palette-list" id="paletteList"></div>
    <div class="palette-foot"><span>↑↓ 选择</span><span>↵ 打开</span><span>Ctrl K 关闭</span></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="确认操作"></div></div>
<div class="toast-stack" id="toasts" aria-live="polite"></div>

<nav class="mobile-tabbar" id="mobileTabbar" aria-label="移动端导航">
  <a href="#/dashboard" data-mobile="dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="9" rx="2"/><rect x="13.5" y="3" width="7.5" height="5.5" rx="2"/><rect x="13.5" y="11.5" width="7.5" height="9.5" rx="2"/><rect x="3" y="15" width="7.5" height="6" rx="2"/></svg>
    <span>工作台</span>
  </a>
  <a href="#/catalog" data-mobile="catalog">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
    <span>资源</span>
  </a>
  <a href="#/jobs" data-mobile="jobs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>
    <span>作业</span>
  </a>
  <a href="#/gpus" data-mobile="gpus">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="2.4"/><path d="M9.5 3.5v3.5M14.5 3.5v3.5M9.5 17v3.5M14.5 17v3.5M3.5 9.5H7M3.5 14.5H7M17 9.5h3.5M17 14.5h3.5"/></svg>
    <span>GPU</span>
  </a>
  <a href="#/alerts" data-mobile="alerts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6 21 19.4H3z"/><path d="M12 9.3v4.4"/><circle cx="12" cy="16.6" r=".9" fill="currentColor" stroke="none"/></svg>
    <span>告警</span>
  </a>
</nav>

<script src="js/runtime.js?v=20261125z188"></script>
    <script src="js/data.js?v=20261125z188"></script>
<script src="js/charts.js?v=20261125z188"></script>
<script src="js/ui.js?v=20261125z188"></script>
<script src="js/pages/core.js?v=20261125z188"></script>
<script src="js/pages/work.js?v=20261125z188"></script>
<script src="js/pages/data.js?v=20261125z188"></script>
<script src="js/pages/admin.js?v=20261125z188"></script>
<script src="js/app.js?v=20261125z188"></script>
</body>
</html>
